<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>돌 AI연구소 · 모바일 소개 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; justify-items: center; background: #eeeadf; color: #254e3b; font-family: system-ui, sans-serif; }
    header { padding: 16px 20px 12px; text-align: center; }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 5px 0 0; font-size: 13px; }
    iframe { display: block; width: min(430px, calc(100vw - 24px)); height: min(844px, calc(100dvh - 92px)); border: 1px solid #d5d5c8; border-radius: 22px; box-shadow: 0 12px 44px #203b3420; background: #f5f1e6; }
    @media (max-width: 480px) { header { padding: 10px; } h1 { font-size: 15px; } p { font-size: 11px; } iframe { width: 100vw; height: calc(100dvh - 62px); border: 0; border-radius: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <header><h1>돌 AI연구소 · 모바일 소개</h1><p>아래 화면 안에서 스크롤하며 확인해 주세요.</p></header>
  <iframe src="../../../#/intro" title="돌 AI연구소 모바일 스크롤 소개" allow="autoplay"></iframe>
</body>
</html>
